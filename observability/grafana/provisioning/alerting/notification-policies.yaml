# Grafana Alerting Notification Policies Configuration
# Documentation: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/

apiVersion: 1

policies:
  - orgId: 1
    # 默认接收者
    receiver: email-alerts
    # 按告警名称和级别分组
    group_by:
      - alertname
      - severity
    # 时间设置
    group_wait: 30s          # 新告警分组等待时间
    group_interval: 5m       # 同组新告警通知间隔
    repeat_interval: 4h      # 未变化告警重复通知间隔

    # 子路由
    routes:
      # 紧急告警 - 立即通知，间隔更短
      - receiver: critical-alerts
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
        continue: false

      # 高级别告警
      - receiver: email-alerts
        object_matchers:
          - ["severity", "=", "high"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 2h
        continue: false
