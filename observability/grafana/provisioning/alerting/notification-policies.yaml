# Grafana Alerting Notification Policies Configuration
# Documentation: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/

apiVersion: 1

policies:
  - orgId: 1
    # Default receiver for all alerts
    receiver: email-alerts
    # Group alerts by these labels
    group_by:
      - alertname
      - severity
    # Timing settings
    group_wait: 30s          # Wait before sending first notification for a new group
    group_interval: 5m       # Wait before sending notification about new alerts in existing group
    repeat_interval: 4h      # Wait before re-sending notification for unchanged alerts

    # Child routes for specific routing
    routes:
      # Critical severity alerts - immediate notification with shorter intervals
      - receiver: critical-alerts
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
        continue: false

      # High severity alerts
      - receiver: email-alerts
        object_matchers:
          - ["severity", "=", "high"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 2h
        continue: false
