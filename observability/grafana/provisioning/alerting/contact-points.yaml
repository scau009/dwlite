# Grafana Alerting Contact Points Configuration
# Documentation: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/

apiVersion: 1

contactPoints:
  # Primary email contact point for alerts
  - orgId: 1
    name: email-alerts
    receivers:
      - uid: email-alerts-receiver
        type: email
        disableResolveMessage: false
        settings:
          # Configure ALERT_EMAIL_TO in .env file
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: false
          subject: |
            [DWLite] {{ .GroupLabels.alertname }}
          message: |
            {{ range .Alerts.Firing }}
            【告警】{{ .Annotations.summary }}
            时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
            级别: {{ .Labels.severity }}

            {{ .Annotations.description }}

            查看日志: {{ .Annotations.runbook_url }}
            ---
            {{ end }}
            {{ if .Alerts.Resolved }}
            【已恢复】
            {{ range .Alerts.Resolved }}
            - {{ .Annotations.summary }}
            {{ end }}
            {{ end }}

  # Critical alerts - for immediate notification
  - orgId: 1
    name: critical-alerts
    receivers:
      - uid: critical-alerts-receiver
        type: email
        disableResolveMessage: false
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: false
          subject: |
            [DWLite 紧急] {{ .GroupLabels.alertname }}
          message: |
            {{ range .Alerts.Firing }}
            【紧急告警】{{ .Annotations.summary }}
            时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}

            {{ .Annotations.description }}

            查看日志: {{ .Annotations.runbook_url }}
            ---
            {{ end }}
