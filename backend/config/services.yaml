# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Monolog\TraceIdProcessor:
        tags:
            - { name: monolog.processor }

    App\Service\MetricsService: ~

    App\Service\Auth\EmailVerificationService:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'
            $verificationTemplateId: '%env(int:SES_VERIFICATION_TEMPLATE_ID)%'

    App\Service\Auth\PasswordResetService:
        arguments:
            $appUrl: '%env(FRONTEND_URL)%'
            $passwordResetTemplateId: '%env(int:SES_PASSWORD_RESET_TEMPLATE_ID)%'

    Predis\Client:
        arguments:
            - '%env(REDIS_URL)%'

    App\Service\CosService:
        arguments:
            $secretId: '%env(COS_SECRET_ID)%'
            $secretKey: '%env(COS_SECRET_KEY)%'
            $region: '%env(COS_REGION)%'
            $bucket: '%env(COS_BUCKET)%'
            $cdnDomain: '%env(COS_CDN_DOMAIN)%'

    App\Service\Mail\TencentSesMailService:
        arguments:
            $secretId: '%env(SES_SECRET_ID)%'
            $secretKey: '%env(SES_SECRET_KEY)%'
            $region: '%env(SES_REGION)%'
            $fromEmail: '%env(SES_FROM_EMAIL)%'
            $fromName: '%env(SES_FROM_NAME)%'

    App\Service\Mail\SymfonyMailerService:
        arguments:
            $fromEmail: '%env(SES_FROM_EMAIL)%'
            $fromName: '%env(SES_FROM_NAME)%'

    # Default to TencentSesMailService for production
    App\Service\Mail\MailServiceInterface:
        alias: App\Service\Mail\TencentSesMailService

    # Product Sync Providers
    App\Service\ProductSync\Provider\KicksDbApiClient:
        arguments:
            $httpClient: '@kicksdb.client'
            $apiKey: '%env(KICKSDB_API_KEY)%'

    App\Service\ProductSync\Provider\KicksDbProvider:
        tags:
            - { name: 'app.product_data_provider', key: 'kicksdb' }

    # Provider Registry with tagged service locator
    App\Service\ProductSync\ProductDataProviderRegistry:
        arguments:
            $providers: !tagged_locator
                tag: 'app.product_data_provider'
                index_by: 'key'

    # Channel Gateway Providers
    App\Service\ChannelGateway\Provider\Mock\MockGateway:
        tags:
            - { name: 'app.channel_gateway', key: 'MOCK' }

    # Kicks Crew Gateway
    App\Service\ChannelGateway\Provider\KicksCrew\KicksCrewApiClient:
        arguments:
            $httpClient: '@kickscrew.client'
            $kickscrewApiLimiter: '@limiter.kickscrew_api'

    App\Service\ChannelGateway\Provider\KicksCrew\KicksCrewGateway:
        tags:
            - { name: 'app.channel_gateway', key: 'KICKSCREW' }

    # Poizon Gateway
    App\Service\ChannelGateway\Provider\Poizon\PoizonApiClient:
        arguments:
            $httpClient: '@poizon.client'

    App\Service\ChannelGateway\Provider\Poizon\PoizonGateway:
        tags:
            - { name: 'app.channel_gateway', key: 'POIZON' }

    # Channel Gateway Registry with tagged service locator
    App\Service\ChannelGateway\ChannelGatewayRegistry:
        arguments:
            $gateways: !tagged_locator
                tag: 'app.channel_gateway'
                index_by: 'key'

    # Scheduler - only runs tasks in production environment
    App\Scheduler\MainSchedule:
        arguments:
            $environment: '%kernel.environment%'

# Development environment: use SymfonyMailerService (MailHog)
when@dev:
    services:
        App\Service\Mail\MailServiceInterface:
            alias: App\Service\Mail\SymfonyMailerService
