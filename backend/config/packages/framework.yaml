# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true
    #fragments: true
    php_errors:
        log: true

    http_client:
        default_options:
            timeout: 30
            max_redirects: 5
        scoped_clients:
            kicksdb.client:
                base_uri: 'https://api.kicks.dev/v3'
                timeout: 60
                max_redirects: 3
                retry_failed:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    jitter: 0.5
            kickscrew.client:
                base_uri: 'https://api.crewsupply.kickscrew.com'
                timeout: 30
                max_redirects: 3
                retry_failed:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    jitter: 0.5
            poizon.client:
                base_uri: 'https://open.poizon.com'
                timeout: 30
                max_redirects: 3
                retry_failed:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    jitter: 0.5

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
